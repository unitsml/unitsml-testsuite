name: Validate feature vectors

on:
  push:
    branches: [main, feat/source-pinned-feature-vectors-20261110]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the append-only check needs the base revision's history
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Feature corpus seals and counts
        run: python -I scripts/check_feature_corpus.py
      - name: Host-evaluator vectors (rederived byte-equal, schema, provenance)
        run: python -I scripts/host_evaluator_vectors.py check
      - name: Evaluator reference generation
        run: python -I scripts/evaluator_reference_vectors.py check
      - name: Ruby feature additions generation
        run: python -I scripts/ruby_feature_additions.py check
      - name: Ruby UnitsML features generation
        run: python -I scripts/ruby_unitsml_features.py check
      - name: Ruby typed quantity accuracy generation
        run: python -I scripts/ruby_typed_quantity_accuracy.py check
      - name: UnitsDB schema and provenance roundtrip generation
        run: python -I scripts/unitsdb_schema_roundtrip.py check
      - name: Ruby explicit power kind generation
        run: python -I scripts/ruby_explicit_kind_power.py check
      - name: Frozen corpora are append-only
        if: github.event_name == 'pull_request'
        run: python -I scripts/check_append_only.py "origin/${{ github.base_ref }}"
      - name: Every validator fails on a tampered corpus
        run: python -I scripts/ci_tamper_selftest.py
